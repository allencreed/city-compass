<style>
        /* Custom map styling to match 'Silver/Muted Blue' brand requirement */
        .map-bg {
            background-color: #e0e3e5; /* tertiary-fixed as base map color */
            background-image: 
                radial-gradient(circle at 30% 40%, rgba(215, 226, 255, 0.4) 0%, transparent 60%), /* primary-fixed soft glow */
                radial-gradient(circle at 70% 60%, rgba(215, 226, 255, 0.3) 0%, transparent 50%);
        }
        
        /* Map roads simulation */
        .map-roads {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(45deg, transparent 48%, rgba(255,255,255,0.6) 49%, rgba(255,255,255,0.6) 51%, transparent 52%),
                linear-gradient(-45deg, transparent 48%, rgba(255,255,255,0.6) 49%, rgba(255,255,255,0.6) 51%, transparent 52%);
            background-size: 150px 150px;
            opacity: 0.5;
        }

        .bonus-zone {
            position: absolute;
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(254, 106, 52, 0.15) 0%, rgba(254, 106, 52, 0.05) 70%, transparent 100%);
            border: 1px dashed rgba(254, 106, 52, 0.4);
            animation: pulse-ring 3s infinite;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        .map-pin {
            position: absolute;
            transform: translate(-50%, -100%);
            transition: transform 0.2s ease, z-index 0.2s;
            cursor: pointer;
        }

        .map-pin:hover {
            transform: translate(-50%, -110%) scale(1.1);
            z-index: 20;
        }

        .map-pin::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 4px;
            background: rgba(0,0,0,0.15);
            border-radius: 50%;
            filter: blur(2px);
            z-index: -1;
        }
        
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
