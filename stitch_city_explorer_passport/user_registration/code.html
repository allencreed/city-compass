<style>
        .map-pattern {
            background-color: #f7f9fb;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23031632' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }
        
        .input-field {
            @apply w-full bg-surface-container-low border-b-2 border-transparent px-4 py-3 rounded-t-lg transition-colors duration-200 focus:outline-none focus:border-primary focus:bg-surface-container-high font-body-md text-on-surface;
        }
        
        .input-label {
            @apply font-label-md text-on-surface-variant mb-1 block;
        }
    </style>
</head>
<body class="map-pattern h-full font-body-md text-on-surface antialiased flex flex-col items-center justify-center p-gutter relative overflow-hidden">
<!-- Decorative elements -->
<div class="absolute top-0 right-0 w-64 h-64 bg-primary rounded-full mix-blend-multiply filter blur-3xl opacity-5 -translate-y-1/2 translate-x-1/3"></div>
<div class="absolute bottom-0 left-0 w-80 h-80 bg-secondary rounded-full mix-blend-multiply filter blur-3xl opacity-5 translate-y-1/3 -translate-x-1/4"></div>
<main class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-[0_4px_24px_rgba(3,22,50,0.08)] border border-surface-variant p-lg relative z-10">
<!-- Header -->
<div class="text-center mb-8">
<div class="inline-flex items-center justify-center w-12 h-12 bg-primary-container rounded-full text-on-primary-container mb-4 shadow-sm">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">explore</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-primary mb-2">Start Your Adventure</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Create your City Passport and begin exploring.</p>
</div>
<!-- Registration Form -->
<form class="space-y-6">
<div class="space-y-4">
<div>
<label class="input-label" for="fullName">Full Name</label>
<input class="input-field" id="fullName" placeholder="Jane Doe" type="text"/>
</div>
<div>
<label class="input-label" for="email">Email Address</label>
<input class="input-field" id="email" placeholder="jane@example.com" type="email"/>
</div>
<div>
<label class="input-label" for="password">Password</label>
<div class="relative">
<input class="input-field" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
</div>
<!-- Location Permission -->
<div class="bg-surface-container rounded-lg p-4 flex items-start space-x-3 border border-surface-variant">
<div class="text-secondary shrink-0 mt-0.5">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">my_location</span>
</div>
<div class="flex-grow">
<h3 class="font-label-bold text-label-bold text-on-surface mb-1 uppercase">Location Access</h3>
<p class="font-body-sm text-body-sm text-on-surface-variant leading-tight">City Passport uses your location to find the right passport for you.</p>
</div>
<label class="relative inline-flex items-center cursor-pointer shrink-0 mt-1">
<input class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-outline-variant peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-secondary"></div>
</label>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary text-on-primary font-headline-sm text-headline-sm py-4 rounded-lg shadow-md hover:bg-primary/90 hover:shadow-lg transition-all duration-200 active:scale-[0.98] flex justify-center items-center" type="submit">
                Register
                <span class="material-symbols-outlined ml-2">arrow_forward</span>
</button>
</form>
<!-- Footer Link -->
<div class="mt-8 text-center">
<a class="font-body-sm text-body-sm text-outline hover:text-primary transition-colors inline-flex items-center" href="#">
<span class="material-symbols-outlined text-[16px] mr-1">storefront</span>
                Are you a business? Join here.
            </a>
</div>
</main>
<script>
        // Simple micro-interaction for the password toggle
        document.querySelector('button[type="button"]').addEventListener('click', function() {
            const input = document.getElementById('password');
            const icon = this.querySelector('.material-symbols-outlined');
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility_off';
            }
        });
    </script>
</body></html>
