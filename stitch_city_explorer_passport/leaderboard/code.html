<script>
        // Simple script to handle segmented control switching visually
        document.addEventListener('DOMContentLoaded', () => {
            const tabs = document.querySelectorAll('.bg-surface-container-highest button');
            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    // Reset all
                    tabs.forEach(t => {
                        t.classList.remove('bg-surface-container-lowest', 'text-primary', 'shadow-sm');
                        t.classList.add('text-on-surface-variant', 'hover:bg-surface-container-low');
                    });
                    // Set active
                    tab.classList.add('bg-surface-container-lowest', 'text-primary', 'shadow-sm');
                    tab.classList.remove('text-on-surface-variant', 'hover:bg-surface-container-low');
                });
            });
        });
    </script>
