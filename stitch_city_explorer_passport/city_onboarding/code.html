<style>

<body class="bg-background text-on-background min-h-screen relative overflow-x-hidden">
<!-- Texture Overlay -->
<div class="fixed inset-0 texture-overlay z-0"></div>
<!-- Main Content Container -->
<main class="relative z-10 w-full max-w-md mx-auto min-h-screen flex flex-col pt-12 pb-32 px-container-padding">
<!-- Header -->
<header class="mb-lg text-center relative">
<span class="material-symbols-outlined text-secondary text-4xl mb-sm" style="font-variation-settings: 'FILL' 1;">my_location</span>
<h1 class="font-headline-lg text-headline-lg text-primary mb-base">Welcome to New York</h1>
<p class="font-body-md text-body-md text-on-surface-variant">We've detected your location. Ready to explore?</p>
</header>
<!-- Detected City Card -->
<section class="mb-xl">
<div class="bg-surface-container-lowest rounded-lg border border-outline-variant shadow-sm overflow-hidden relative group cursor-pointer transition-transform hover:scale-[1.02] duration-300">
<div class="h-48 w-full relative">
<img class="w-full h-full object-cover" data-alt="A breathtaking, cinematic daytime shot of the New York City skyline featuring the Empire State Building and surrounding skyscrapers. The lighting is crisp and bright, establishing a premium, optimistic mood consistent with a modern travel application. The aesthetic is clean and modern, emphasizing architectural verticality and vast urban scale against a clear blue sky." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAqrLFElqPMoATk2ksOPRKPA023f6RODnKFfk84OpSGb7TjMApjz1jiIjfw9ZI6ZsCScfUSzkihLgNjquPvjugqhORv3XAijQHL4ZJvmLj--ioFM2DxXiU35fjt-aIVCKHLxQ_gnYTm9nD-gkOlpCxiq8Q0s_Kyg6zYImYEVrkuh8VqhBqIhXgXQssFnN41Cwm2EHBIe6z9twN8fHGI0YU7GOQ745k33fDb6fC82ZSEceMQU_UZPFB9RA"/>
<div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent"></div>
<div class="absolute bottom-md left-md right-md flex justify-between items-end">
<div>
<span class="font-label-bold text-label-bold text-on-primary uppercase tracking-wider block mb-xs opacity-90">Current Location</span>
<h2 class="font-headline-md text-headline-md text-on-primary">New York City</h2>
</div>
<div class="bg-secondary text-on-secondary rounded-full p-2 stamp-rotation shadow-md">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">verified</span>
</div>
</div>
</div>
<div class="p-md flex justify-between items-center bg-surface-container-lowest">
<p class="font-body-sm text-body-sm text-on-surface">Unlock your first passport book!</p>
<button class="bg-primary text-on-primary font-label-md text-label-md py-2 px-4 rounded-lg shadow-sm hover:opacity-90 transition-opacity">
                        Unlock Passport
                    </button>
</div>
</div>
</section>
<!-- Divider -->
<div class="flex items-center mb-lg">
<div class="flex-grow h-px bg-outline-variant/50"></div>
<span class="font-label-bold text-label-bold text-outline uppercase px-md">Or Change City</span>
<div class="flex-grow h-px bg-outline-variant/50"></div>
</div>
<!-- City Selection Grid -->
<section class="grid grid-cols-2 gap-md mb-xl">
<!-- London -->
<div class="bg-surface-container-lowest rounded-lg border border-outline-variant shadow-sm overflow-hidden group cursor-pointer hover:shadow-md transition-all duration-200">
<div class="h-32 w-full relative">
<img class="w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all duration-500" data-alt="A striking, editorial-style photograph of the London Eye and River Thames at golden hour. Warm sunlight bathes the scene, creating a sophisticated and inviting travel aesthetic. The composition is balanced and modern, emphasizing the iconic wheel structure against a softly lit sky, fitting for a premium digital curation app." src="https://lh3.googleusercontent.com/aida-public/AB6AXuA3ObIwXMZg1Oh-nULo6birbZ0LcAC9lTzI4BGshQAdzWRLFCp34YyHpvgX9uoJjpqmSCm2WdTUDkorjWLbUYVmCMkm3INGtPs3yi1qGME7lCNT9ui7HIV2Pj2hpAIyU0MhIC-qeaeKKReE2-WMCqZmiYbBNkZ92kIf_7Z0e1yYhmMXAo-mNQWT5_Govc2oAGRcd-NcMDZavdQ32hWezAn07e95RduQeVOQn6B6LYi9dr854YpVifII0w"/>
<div class="absolute inset-0 bg-primary/20 group-hover:bg-transparent transition-colors duration-300"></div>
</div>
<div class="p-3 text-center border-t border-outline-variant/30">
<h3 class="font-headline-sm text-headline-sm text-primary">London</h3>
</div>
</div>

<div class="absolute inset-0 bg-primary/20 group-hover:bg-transparent transition-colors duration-300"></div>
</div>
<div class="p-3 text-center border-t border-outline-variant/30">
<h3 class="font-headline-sm text-headline-sm text-primary">Tokyo</h3>
</div>
</div>
<!-- Paris -->

<img class="w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all duration-500" data-alt="A minimalist and elegant view of the Eiffel Tower framed by classical Parisian architecture on a clear day. The lighting is soft and natural, emphasizing the light-mode aesthetic of the interface. The mood is romantic yet highly structured, conveying the reliability and premium feel of traditional travel documents." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCfYvqOsDin_FLG0N8JdMdH70XVvW-1IL-M_FEM-Hy4HttwO1LB-i-K4KznhqaaIKPXlf1t7x0pR18lBKawru23GgrrYhoQ5vQ9KeDLx7nIZG_EJAAat_3EAinQQxWO1BJYCmB8_hyB-fJjiBPeMS3VuiB7XHJYxUccAa_wOCwT9RwLt0T9gK1EbZW_y7OXn0bmm08wsF5TeJc3Ycz9Q9itdZBNwqWBDKCffxdPyt4BZ4S2U5UC28Hm8w"/>
<div class="absolute inset-0 bg-primary/20 group-hover:bg-transparent transition-colors duration-300"></div>
</div>
<div class="p-3 text-center border-t border-outline-variant/30">
<h3 class="font-headline-sm text-headline-sm text-primary">Paris</h3>
</div>
</div>
<!-- Los Angeles -->
<div class="bg-surface-container-lowest rounded-lg border border-outline-variant shadow-sm overflow-hidden group cursor-pointer hover:shadow-md transition-all duration-200">
<div class="h-32 w-full relative">
<img class="w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all duration-500" data-alt="A cinematic, sun-drenched view of palm trees lining a Los Angeles street with the Hollywood sign subtly visible in the distant hills. The color palette features bright blues and warm earth tones, evoking a sense of classic Californian adventure. The imagery is clean and spacious, complementing a modern digital curation layout." src="https://lh3.googleusercontent.com/aida-public/AB6AXuASJrFNeZQBS2aacyhvrSrHZFaWyNSJOaOqwYSPhudqMfttQ2UnqvEPof40NTbluCR1pKSOT_wFPECsQ07J_QjNWd9ssm2uoWr5Fghw7fgDIyKRc4Fnjurrri6yilRXvPLc2S9Mp7g-v_3LMlth85bb9cT9q4Smp7PU99Qr-IXzF0CBOPFmZeLgRU0r6YB0-QTxgKl0PkkVORcyT_zq-zuUnq1mGgja7jlbYNn9HDQX_dxwOWwWL5n9_g"/>
<div class="absolute inset-0 bg-primary/20 group-hover:bg-transparent transition-colors duration-300"></div>
</div>
<div class="p-3 text-center border-t border-outline-variant/30">
<h3 class="font-headline-sm text-headline-sm text-primary">Los Angeles</h3>
</div>
</div>
</section>
</main>
<!-- Suppressed TopAppBar and BottomNavBar as this is an onboarding/linear flow -->
<script>
        // Simple micro-interaction for selecting cities
        document.querySelectorAll('.grid > div').forEach(card => {
            card.addEventListener('click', function() {
                // Reset others
                document.querySelectorAll('.grid > div').forEach(c => {
                    c.classList.remove('ring-2', 'ring-secondary');
                    c.querySelector('img').classList.add('grayscale');
                });
                
                // Set active
                this.classList.add('ring-2', 'ring-secondary');
                this.querySelector('img').classList.remove('grayscale');
                
                // Update header visually for demo
                const cityName = this.querySelector('h3').innerText;
                const headerText = document.querySelector('header h1');
                headerText.style.opacity = 0;
                setTimeout(() => {
                    headerText.innerText = `Welcome to ${cityName}`;
                    headerText.style.opacity = 1;
                }, 200);
            });
        });
    </script>
</body></html>
